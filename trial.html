<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background: #010a16; color: white; }
        
        .spacer { height: 100vh; display: flex; align-items: center; justify-content: center; font-size: 3rem; }

        /* The Magic Container */
        .scroll-container {
            position: relative;
            height: 400vh; /* Length of the scroll journey */
        }

        .sticky-frame {
            position: sticky;
            top: 0;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0; /* Hidden by default */
            transition: opacity 0.5s ease;
        }

        .active { opacity: 0.6; } /* Current image visibility */

        .content-overlay {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 600px;
        }
    </style>
</head>
<body>

    <div class="spacer">Scroll to see the Model...</div>

    <div class="scroll-container" id="trigger">
        <div class="sticky-frame">
            <!-- Your 3 Changing Images -->
            <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1500" class="bg-image img-1 active">
            <img src="https://images.unsplash.com/photo-1563986768609-322da13575f3?auto=format&fit=crop&w=1500" class="bg-image img-2">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1500" class="bg-image img-3">

            <div class="content-overlay">
                <h2 id="scroll-text" style="font-size: 3rem;">Observation</h2>
                <p id="scroll-subtext">We collect real-time data from across the Himalayas.</p>
            </div>
        </div>
    </div>

    <div class="spacer">End of Story.</div>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        const tl = gsap.timeline({
            scrollTrigger: {
                trigger: "#trigger",
                start: "top top",
                end: "bottom bottom",
                scrub: 1, // Smoothly ties animation to scroll
            }
        });

        // Step 1: Fade out Image 1, Fade in Image 2
        tl.to(".img-1", { opacity: 0 }, 1)
          .to(".img-2", { opacity: 0.6 }, 1)
          .set("#scroll-text", { innerText: "Modeling" }, 1)

        // Step 2: Fade out Image 2, Fade in Image 3
        tl.to(".img-2", { opacity: 0 }, 2)
          .to(".img-3", { opacity: 0.6 }, 2)
          .set("#scroll-text", { innerText: "Impact" }, 2);
    </script>
</body>
</html>
